name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/check.yml'
      - 'signing-fingerprint.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Signing secrets live only in the `release` environment, which only `main` may use.
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4

      # versionCode is the workflow run number, so every push produces a newer
      # build and `adb install -r` upgrades in place instead of erroring.
      - name: Stamp version
        id: ver
        run: |
          RUN=${{ github.run_number }}
          BASE=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          VERSION="${BASE}.${RUN}"
          sed -i -E "s/versionCode = .*/versionCode = ${RUN}/" app/build.gradle.kts
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      # The DSP is pure Kotlin; these catch an unstable filter before it ships.
      - name: Unit test the synth engine
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # The release variant ships: it is not debuggable, so `run-as` cannot read the app's
      # data. It is built unsigned and signed below with the rotated key and its lineage.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          # Where shake-to-report posts: a URL, not a secret. Unset, reports queue on the phone.
          REPORT_RELAY_URL: ${{ vars.REPORT_RELAY_URL }}

      # Android identifies an app by (packageName, signing certificate). The script fails
      # unless the APK verifies with the pinned new certificate (signing-fingerprint.txt)
      # and its v3 lineage chains back to the original one
      # (signing-lineage-root-fingerprint.txt), so existing installs keep updating.
      - name: Sign and verify release APK
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SIGNING_LINEAGE_BASE64: ${{ secrets.SIGNING_LINEAGE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for secret in RELEASE_KEYSTORE_BASE64 SIGNING_LINEAGE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ ! ${!secret} =~ [^[:space:]] ]]; then
              echo "::error::Missing required release signing secret: $secret"
              exit 1
            fi
          done

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/brightnoise-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          export KEYSTORE_FILE="$signing_dir/release.jks" SIGNING_LINEAGE_FILE="$signing_dir/release.lineage"
          decode() {
            if ! printf '%s' "${!1}" | base64 --decode > "$2" || [[ ! -s "$2" ]]; then
              echo "::error::$1 must contain non-empty base64"
              exit 1
            fi
          }
          decode RELEASE_KEYSTORE_BASE64 "$KEYSTORE_FILE"
          decode SIGNING_LINEAGE_BASE64 "$SIGNING_LINEAGE_FILE"
          unset RELEASE_KEYSTORE_BASE64 SIGNING_LINEAGE_BASE64

          bash scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk \
            "LightNoise-v$VERSION.apk" signing-lineage-root-fingerprint.txt signing-fingerprint.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightNoise-apk
          path: LightNoise-v${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: LightNoise v${{ steps.ver.outputs.version }}
          files: LightNoise-v${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
          make_latest: true

      # Tell the index a release exists instead of waiting for its cron. GitHub
      # schedules are best-effort -- observed 70 minutes apart against a 15
      # minute schedule -- so without this a new release can sit uncatalogued
      # for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}" \
          || echo "index ping failed; the hourly cron will pick this up"
