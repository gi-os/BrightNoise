name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/check.yml'
      - 'signing-fingerprint.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4

      # versionCode is the workflow run number, so every push produces a newer
      # build and `adb install -r` upgrades in place instead of erroring.
      - name: Stamp version
        id: ver
        run: |
          RUN=${{ github.run_number }}
          BASE=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          VERSION="${BASE}.${RUN}"
          sed -i -E "s/versionCode = .*/versionCode = ${RUN}/" app/build.gradle.kts
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      # The DSP is pure Kotlin; these catch an unstable filter before it ships.
      - name: Unit test the synth engine
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
        env:
          # Shake-to-report posts issues with this. Absent, the build still works —
          # reports queue on the phone until a build that has the key installs over it.
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}

      # Android identifies an app by (packageName, signing certificate). A drifting
      # certificate shows up only as "Failure: Invalid" at install time, days later,
      # so pin it and fail the build here instead. The keystore is committed, which
      # is what keeps it stable across runners.
      - name: Verify the signing certificate has not drifted
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ACTUAL=$("$BT/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk \
            | grep -i 'certificate SHA-256 digest' | head -1 \
            | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ' \r' | tr 'A-F' 'a-f')
          EXPECTED=$(tr -d ' \n\r' < signing-fingerprint.txt | tr 'A-F' 'a-f')
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ -z "$ACTUAL" ]; then echo "APK is not signed at all"; exit 1; fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Signing certificate changed — installs would fail with 'Invalid'."
            exit 1
          fi

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "LightNoise-v${{ steps.ver.outputs.version }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightNoise-apk
          path: LightNoise-v${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: LightNoise v${{ steps.ver.outputs.version }}
          files: LightNoise-v${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
          make_latest: true

      # Tell the index a release exists instead of waiting for its cron. GitHub
      # schedules are best-effort -- observed 70 minutes apart against a 15
      # minute schedule -- so without this a new release can sit uncatalogued
      # for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}" \
          || echo "index ping failed; the hourly cron will pick this up"
